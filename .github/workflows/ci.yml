# CI for CreatorAi. Mirrors `make lint` and `make test`; none of it needs network access to AI providers
# or Hugging Face (the backend tests use a hashing embedder and recorded HTTP).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install FFmpeg (media tests render and probe real files)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
      - name: Ruff
        working-directory: backend
        run: |
          ruff check --config pyproject.toml . ../scripts
          ruff format --config pyproject.toml --check . ../scripts
      - name: Markdown links
        run: python scripts/check_links.py
      - name: Pytest
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  # Optional and slower: the Playwright suite against the real stack (`make e2e`).
  # It needs Python + Node + FFmpeg + a Chromium. Run it on demand (Actions tab, "Run workflow") or on a
  # schedule rather than on every push so a flaky browser cannot block merges. Remove `if:` to run it always.
  e2e:
    name: End-to-end (Playwright, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e "backend[dev]"
          cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run e2e
        run: make e2e
