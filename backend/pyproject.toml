[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creatorai-backend"
version = "0.1.0"
description = "CreatorAi local-first backend (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyJWT>=2.8",
  "cryptography>=42",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "Pillow>=10.2",
  "opencv-python-headless>=4.9,<5",  # Haar cascades (ml/faces.py) are not in OpenCV 5
  "scenedetect>=0.6.3,<0.7",  # 0.7 hard-requires opencv-python (full), which pulls OpenCV 5 over our headless 4.x
  "vaderSentiment>=3.3.2",
  "fastembed>=0.4",        # real embeddings (ONNX MiniLM, no torch); model downloads on first use
  "faster-whisper>=1.0",   # local ASR fallback (CTranslate2, no torch)
  "yt-dlp>=2024.1",        # YouTube video downloader
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
# Optional alternative embedder (pulls torch). fastembed is already a core dependency.
ml = ["sentence-transformers>=2.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "SIM905", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
